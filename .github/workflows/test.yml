name: 🧪 Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync

      - name: Run tests with coverage
        run: |
          uv run python -m pytest --junitxml=junit.xml --cov-report xml:coverage.xml --cov=tikara

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml

      - name: Commit reports
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Add test, benchmark and coverage reports
          file_pattern: junit.xml coverage.xml
          commit_user_name: Tikara Test Bot
