# Simple workflow for deploying static content to GitHub Pages
name: 📚 Generate and deploy documentation

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies with uv
        run: |
          uv sync
          uv pip install -e .

      # No sphinx-apidoc step: AutoAPI (see docs/source/conf.py) documents the
      # package by parsing the source, and its output is what index.rst links to.
      # sphinx-apidoc emitted extra automodule stubs that were in no toctree but
      # were still read, importing tikara and making autodoc touch JPype-backed
      # attributes with no JVM running.
      - name: Sphinx build
        run: |
          uv run sphinx-build -b html docs/source/ docs/build/html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs/build/html"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
