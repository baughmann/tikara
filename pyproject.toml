[project]
name = "tikara"
dynamic = ["version"]
description = "The metadata and text content extractor for almost every file type."
readme = "README.md"
authors = [{ name = "Nick Baughman", email = "baughmann1@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Jupyter",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Java",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
keywords = [
    "apache-tika",
    "content-detection",
    "content-extraction",
    "content-indexing",
    "content-intelligence",
    "content-management",
    "content-parsing",
    "content-processing",
    "content-type",
    "data-extraction",
    "data-parsing",
    "data-processing",
    "document-ai",
    "document-analysis",
    "document-automation",
    "document-classification",
    "document-converter",
    "document-extraction",
    "document-indexing",
    "document-intelligence",
    "document-management",
    "document-metadata",
    "document-ocr",
    "document-parsing",
    "document-processing",
    "document-reader",
    "document-text",
    "document-understanding",
    "docx",
    "excel",
    "file-analysis",
    "file-conversion",
    "file-format",
    "file-identification",
    "file-parsing",
    "file-processing",
    "file-reader",
    "file-type",
    "format-detection",
    "format-identification",
    "image-extraction",
    "information-extraction",
    "language-detection",
    "metadata",
    "mime-type",
    "ocr",
    "office-documents",
    "pdf-parsing",
    "pdf",
    "powerpoint",
    "structured-data",
    "text-analytics",
    "text-extraction",
    "text-mining",
    "text-parsing",
    "text-processing",
    "text-recognition",
    "tika",
    "unstructured-data",
    "word-documents",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
dependencies = ["jpype1>=1.5.1", "pydantic>=2.10.5"]

[project.urls]
Homepage = "https://github.com/baughmann/tikara"
Issues = "https://github.com/baughmann/tikara/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/**"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
version_scheme = "python-simplified-semver"

[tool.hatch.build.targets.wheel]
packages = ["src/tikara"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
markers = [
    "benchmark: mark a test as a benchmark",
    "isolated: mark a test as needing conftest.py to be excluded",
]

[tool.uv]
# Wait a week before resolving to freshly published versions, so a compromised or
# broken release has time to be yanked before it lands in our lock file.
exclude-newer = "7 days"

# authlib 1.8.0 switched its httpx integration to the `httpx2` distribution, but
# safety still builds `httpx.Timeout` objects (httpx 0.28) and hands them to that
# client, which blows up with `TypeError: 'Timeout' object cannot be interpreted as
# an integer` on every request. `httpx2` is pulled in unavoidably by hatch, so cap
# authlib below 1.8 until safety supports httpx2. Floor stays at 1.6.12 (CVE fix).
constraint-dependencies = ["authlib>=1.6.12,<1.8"]

[dependency-groups]
dev = [
    "hatch>=1.18.0",
    "ipykernel>=7.3.0",
    "myst-parser>=5.1.0",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "ruff>=0.16.4",
    "safety>=3.8.1",
    "sphinx>=9.1.0",
    "sphinx-autoapi>=3.8.1",
    "sphinx-autodoc-defaultargs>=0.1.2",
    "sphinx-autodoc-typehints>=3.13.4",
    "sphinx-design>=0.7.0",
    "sphinx-git>=11.0.0",
    "sphinx-sitemap>=2.9.0",
    "sphinxawesome-theme>=6.0.5",
    "sphinxemoji>=0.3.2",
    "stubgenj>=0.2.12",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 120
show-fixes = true
src = ["src", "tests"]
# *.md: ruff >=0.16 formats fenced code blocks in Markdown; the README's samples are
# deliberately wrapped for readability in a narrow column, so keep them hand-formatted.
exclude = ["*.ipynb", "*.md", "stubs", "examples", "docs"]


[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings 
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "FBT",   # flake8-boolean-trap
    "C4",    # flake8-comprehensions
    "T20",   # flake8-print
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "ERA",   # eradicate
    "ICN",   # flake8-import-conventions
    "PT",    # flake8-pytest-style
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "INP",   # flake8-no-pep420
    "RSE",   # flake8-raise
    "EM",    # flake8-errmsg
    "T10",   # flake8-debugger
    "BLE",   # flake8-blind-except
    "S",     # flake8-bandit
    "ISC",   # flake8-implicit-str-concat
    "C90",   # mccabe
    "ANN",   # typing-annotations
    "PLW",   # pylint warnings
    "PLR",   # pylint refactor
    "PLE",   # pylint errors
    "RUF",   # ruff-specific rules
    "PD",    # pandas-vet
    "PGH",   # pygrep-hooks
    "TRY",   # tryceratops
    "NPY",   # numpy-specific rules
    "AIR",   # airflow
    "PERF",  # perflint
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "D",     # pydocstyle
]
ignore = [
    "ISC001", # Implicit string concatenation
    "D418",   # Docstrings on @overload: each overload documents its own return shape,
              # and sphinx-autoapi renders them in the published API reference.
]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"test/*" = ["ANN", "D", "S", "PLR0913", "PLR0917"]

[tool.pyright]
stubPath = "stubs"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
